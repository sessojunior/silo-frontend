version: '3.8'

services:
  # Servidor de arquivos
  fileserver:
    build: ./fileserver
    ports:
      # Exponha a porta 4000 do container para a porta 4000 do host
      - '4000:4000'
    environment:
      # URLs públicas para retornar ao navegador (CORS, CSP, respostas JSON)
      - FILESERVER_URL=${FILESERVER_URL:-http://localhost:4000}
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      - ./fileserver/uploads:/app/uploads
    restart: unless-stopped

  # Aplicação principal Next.js
  app:
    build: .
    ports:
      # Exponha a porta 3000 do container para a porta 80 do hodt
      - '80:3000'
    environment:
      # Ambiente e banco
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      
      # URLs do sistema
      - APP_URL=${APP_URL:-http://localhost:3000}
      # URL interna do Docker para comunicação entre containers
      - FILESERVER_URL=${FILESERVER_URL:-http://fileserver:4000}
      
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # Email SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}

    depends_on:
      - fileserver
    restart: unless-stopped
